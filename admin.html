<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智慧健康便當｜業者後台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>📊 業者管理後台</h1>
  <p>上架管理　·　銷售與顧客偏好分析</p>
  <div style="margin-top:6px"><a class="navlink" href="index.html">← 回到消費者點餐端</a></div>
</header>

<div class="wrap">

  <div class="section-title">今日營運總覽</div>
  <div class="stat-grid" id="statGrid"></div>

  <div class="section-title">熱門便當排行 <small>依實際訂單統計</small></div>
  <div id="rankChart" class="custom"></div>

  <div class="section-title">顧客目標分佈 <small>減脂／增肌客群佔比</small></div>
  <div id="goalChart" class="custom"></div>

  <div class="section-title">便當上架管理 <small>下架的品項不會出現在點餐端</small></div>
  <table class="admin" id="menuTable">
    <thead><tr><th>便當</th><th>價格</th><th>熱量</th><th>蛋白質</th><th>今日售出</th><th>狀態</th></tr></thead>
    <tbody></tbody>
  </table>

  <div class="center" style="margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <button class="btn ghost sm" id="seedBtn">產生示範訂單（demo 用）</button>
    <button class="btn danger sm" id="clearBtn">清空所有訂單資料</button>
  </div>
  <p class="muted center" style="margin-top:10px">※ demo 版統計資料存在瀏覽器本機（localStorage）。正式版可接雲端資料庫做多裝置即時同步（未來延伸）。</p>

</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="admin.js"></script>
</body>
</html>
